<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pulse-chat — test client</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; border-radius: 6px; height: 320px; overflow-y: auto; padding: .5rem; margin: 1rem 0; background: #fafafa; }
    #log div { padding: 2px 4px; border-bottom: 1px dotted #eee; font-size: .9rem; }
    .row { display: flex; gap: .5rem; margin: .5rem 0; flex-wrap: wrap; }
    input { padding: .4rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
    .msg-input { flex: 1; min-width: 200px; }
  </style>
</head>
<body>
  <h1>pulse-chat test client</h1>
  <p>Needs a room first: <code>POST /api/rooms {"name":"general"}</code>. Open this page in two tabs with different usernames to see chat + typing.</p>

  <div class="row">
    <label>username <input id="username" value="alice" size="10"></label>
    <label>room id <input id="roomId" value="1" size="4"></label>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
  </div>

  <div id="log"></div>

  <div class="row">
    <input id="msg" class="msg-input" placeholder="type a message…" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
    <button onclick="sendTyping()">Typing…</button>
    <button onclick="sendHeartbeat()">Heartbeat</button>
    <button onclick="fetchPresence()">Presence</button>
  </div>

  <script>
    let stomp = null;
    let heartbeatTimer = null;

    const logEl = document.getElementById('log');
    function log(text) {
      const div = document.createElement('div');
      div.textContent = new Date().toLocaleTimeString() + '  ' + text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }
    const roomId = () => document.getElementById('roomId').value;

    function connect() {
      const username = document.getElementById('username').value.trim();
      if (!username) { log('pick a username first'); return; }
      const socket = new SockJS('/ws?username=' + encodeURIComponent(username));
      stomp = StompJs.Stomp.over(socket);
      stomp.debug = null; // quiet the frame logging
      stomp.connect({}, () => {
        log('connected as ' + username);
        stomp.subscribe('/topic/rooms/' + roomId(), m => {
          const b = JSON.parse(m.body);
          log('💬 [' + b.sender + '] ' + b.content);
        });
        stomp.subscribe('/topic/rooms/' + roomId() + '/typing', m => {
          const b = JSON.parse(m.body);
          log('⌨️  ' + b.username + ' is typing…');
        });
        stomp.subscribe('/user/queue/errors', m => log('⚠️ error: ' + m.body));
        // keep presence alive, like a real client would
        heartbeatTimer = setInterval(sendHeartbeat, 30000);
        sendHeartbeat();
      }, err => log('connect failed: ' + err));
    }

    function disconnect() {
      clearInterval(heartbeatTimer);
      if (stomp) { stomp.disconnect(() => log('disconnected')); stomp = null; }
    }

    function send() {
      const content = document.getElementById('msg').value;
      if (!content.trim() || !stomp) return;
      stomp.send('/app/chat.send', {}, JSON.stringify({ roomId: +roomId(), content }));
      document.getElementById('msg').value = '';
    }

    function sendTyping() {
      if (stomp) stomp.send('/app/chat.typing', {}, JSON.stringify({ roomId: +roomId() }));
    }

    function sendHeartbeat() {
      if (stomp) stomp.send('/app/chat.heartbeat', {}, JSON.stringify({ roomId: +roomId() }));
    }

    async function fetchPresence() {
      const res = await fetch('/api/rooms/' + roomId() + '/presence');
      log('🟢 online: ' + await res.text());
    }
  </script>
</body>
</html>
